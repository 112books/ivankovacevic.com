name: Fetch gallery covers

on:
  schedule:
    - cron: '0 5 * * *'   # cada nit a les 5:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instal·la dependències Python
        run: pip install -r requirements.txt --break-system-packages

      # Autoallotja les portades a static/images/galleries/ i reescriu 'cover'.
      # Imprescindible: blog.pocallum.cat envia Cross-Origin-Resource-Policy:
      # same-site i el navegador bloqueja les miniatures enllaçades en calent.
      - name: Desa les portades en local
        run: python3 scripts/fetch-gallery-covers.py

      - name: Commit si hi ha canvis
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/galleries.yaml static/images/galleries
          git diff --staged --quiet || (
            git commit -m "chore: actualitzar portades galeries [skip ci]" &&
            git pull --rebase &&
            git push
          )
