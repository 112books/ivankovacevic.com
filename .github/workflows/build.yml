name: Build check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check social preview images
        # Fallaria si s'afegeix o canvia una foto/portada i no s'han regenerat
        # les variants 1200×630 (scripts/make-og-images.py).
        run: |
          pip install -q Pillow
          python3 scripts/make-og-images.py --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build
        run: hugo --minify --environment production
