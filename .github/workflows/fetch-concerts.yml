name: Fetch concerts iCal

on:
  schedule:
    - cron: '0 3 * * *'   # cada nit a les 3:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Sync agenda (multi-font via data/sources.yaml)
        run: python3 scripts/sync-agenda.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/concerts.txt data/concerts-schema.json
          git diff --staged --quiet || {
            git commit -m "chore: actualitzar agenda i schema [skip ci]"
            git pull --rebase origin main
            git push
          }

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Fetch concerts iCal failed"
          gh issue create \
            --title "Fetch concerts iCal failed" \
            --body "The scheduled workflow to sync the agenda has failed.\n\n**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label "bug,automation" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
