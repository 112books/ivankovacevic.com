name: Fetch YouTube videos

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Sync videos (multi-canal via data/sources.yaml)
        run: python3 scripts/sync-videos.py

      - name: Commit si hi ha canvis
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/videos.json
          git diff --staged --quiet || {
            git commit -m "chore: actualitzar videos.json [skip ci]"
            git pull --rebase origin main
            git push
          }
